<!doctype html>
<meta charset="utf-8">
<title>Fly Chess · progress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root { --ground:#0A0C11; --panel:#141821; --line:rgba(233,230,221,.12); --text:#E9E6DD; --muted:#8B909D; --accent:#8FD3E8; --amber:#F2B841; --green:#7BD389; }
  body { margin:0; background:var(--ground); color:var(--text); font-family:"IBM Plex Sans",system-ui,sans-serif; display:grid; place-items:center; min-height:100vh; }
  main { width:min(720px, 92vw); }
  h1 { font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:30px; margin:0 0 4px; }
  h1 em { font-style:italic; color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  .job { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .job .name { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .job .name b { font-weight:600; }
  .job .name span { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .track { height:14px; border-radius:7px; background:rgba(255,255,255,.07); overflow:hidden; }
  .fill { height:100%; width:0; background:linear-gradient(90deg, var(--accent), #5FB8D6); transition:width .6s ease; }
  .job.done .fill { background:var(--green); }
  .meta { display:flex; gap:18px; flex-wrap:wrap; margin-top:10px; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .meta b { color:var(--text); font-weight:500; }
  .pct { font-family:"Fraunces",Georgia,serif; font-size:34px; font-weight:300; color:var(--text); line-height:1; }
  .job.done .pct { color:var(--green); }
  .foot { color:var(--muted); font-size:12px; margin-top:16px; font-family:"IBM Plex Mono",monospace; }
  .stale { color:var(--amber); }
</style>
<main>
  <h1>Fly Chess <em>progress</em></h1>
  <p class="sub">Every job on this Mac owns a slot in <code>data/progress.json</code>; a rented GPU reports through <code>data/progress_gpu.txt</code>. Refreshes every 2 seconds.</p>
  <div id="jobs"></div>
  <p class="foot" id="foot">connecting…</p>
</main>
<script>
const jobs = document.getElementById("jobs"), foot = document.getElementById("foot");
let lastChange = Date.now(), lastText = "";
async function tick() {
  try {
    const grab = async f => { try { const r = await fetch(f + "?ts=" + Date.now(), { cache: "no-store" }); return r.ok ? await r.text() : ""; } catch (e) { return ""; } };
    const [stateRaw, txtRaw, gpuRaw] = await Promise.all([grab("data/progress.json"), grab("data/progress.txt"), grab("data/progress_gpu.txt")]);
    let items = [];
    try {
      const state = JSON.parse(stateRaw || "{}");
      items = Object.entries(state).map(([slot, v]) => ({
        slot, label: v.label || slot, pct: v.total ? 100 * v.done / v.total : 0,
        done: v.done, total: v.total, el: v.elapsed_min, eta: v.eta_min,
        fin: v.finished, age: (Date.now() / 1000) - v.ts,
      })).sort((a, b) => a.slot.localeCompare(b.slot));
    } catch (e) {}
    // jobs started before the per-slot change still write plain lines; merge them in by label
    const parseBar = (l, tag) => {
      const m = l.match(/^(.*?)\s*\[[█░]*\]\s*([\d.]+)%\s*·\s*([\d,]+)\/([\d,]+)\s*·\s*([\d.]+) min elapsed\s*·\s*([\d.nan]+) min left/);
      if (!m) return null;
      const num = s => +s.replace(/,/g, "");
      return { slot: tag || m[1].trim(), label: m[1].trim() + (tag ? " (" + tag + ")" : ""), pct: +m[2], done: num(m[3]), total: num(m[4]), el: +m[5], eta: parseFloat(m[6]), fin: false, age: 0 };
    };
    const known = new Set(items.map(j => j.label));
    for (const l of (txtRaw || "").split("\n").filter(l => l.includes("["))) {
      const j = parseBar(l);
      if (j && !known.has(j.label)) { j.fin = j.pct >= 100; items.push(j); known.add(j.label); }
    }
    // the rented GPU still reports through a plain text file copied back by remote/sync.sh
    const gl = (gpuRaw || "").split("\n").filter(l => l.includes("["));
    if (gl.length) {
      const m = gl[0].match(/^(.*?)\s*\[[█░]*\]\s*([\d.]+)%\s*·\s*(\d+)\/(\d+)\s*·\s*([\d.]+) min elapsed\s*·\s*([\d.nan]+) min left/);
      const j = parseBar(gl[0], "rented GPU");
      if (j) { j.fin = /(^|\n)done/.test(gpuRaw); items.push(j); }
    }
    const text = stateRaw + gpuRaw;
    if (text !== lastText) { lastChange = Date.now(); lastText = text; }
    jobs.innerHTML = items.length ? items.map(j => {
      const fin = j.fin || j.pct >= 100, stale = !fin && j.age > 120;
      return `<div class="job ${fin ? "done" : ""}"><div class="name"><b>${j.label}</b><span>${fin ? "finished" : stale ? "no update for " + Math.round(j.age / 60) + " min" : "running"}</span></div>
        <div class="track"><div class="fill" style="width:${Math.min(100, j.pct).toFixed(1)}%"></div></div>
        <div class="meta"><span class="pct">${fin ? "100" : j.pct.toFixed(1)}%</span><span><b>${j.done.toLocaleString()}</b> of ${j.total.toLocaleString()}</span><span><b>${j.el.toFixed(1)}</b> min elapsed</span><span>${fin || j.eta == null || isNaN(j.eta) ? "" : `<b>${j.eta.toFixed(1)}</b> min left`}</span></div></div>`;
    }).join("") : `<div class="job"><div class="name"><b>no job running</b></div></div>`;
    const age = Math.round((Date.now() - lastChange) / 1000);
    foot.innerHTML = `${items.length} job${items.length === 1 ? "" : "s"} · last change ${age}s ago · ${new Date().toLocaleTimeString()}`;
  } catch (e) { foot.innerHTML = `<span class="stale">cannot read data/progress.json: is the local server running? (python3 -m http.server 8931)</span>`; }
}
tick(); setInterval(tick, 2000);
</script>
