<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" role="img" aria-label="How far the fly's agreement with Stockfish falls when each part of its brain is silenced. The visual pathway and the descending neurons are load bearing; the mushroom body, central complex and lateral horn cost nothing.">
<text x="14" y="24" font-size="14" font-weight="600" fill="currentColor">Silencing each part of the brain</text>
